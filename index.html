<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tony's Plan</title>
<style>
:root{--bg:#0b0d10;--card:#151a20;--line:#27313c;--fg:#e8eef5;--mut:#7f909f;--acc:#d4ff3a;--on:#0b0d10}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
h2{font-size:13px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--mut)}
.day{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.day b{font-size:18px}.day small{color:var(--mut);display:block}
.pill{background:var(--acc);color:var(--on);border-radius:99px;padding:8px 16px;font-weight:700}
button{font:inherit;cursor:pointer;border:0}
.big{width:100%;background:var(--acc);color:var(--on);font-weight:800;font-size:19px;padding:18px;border-radius:14px;margin-top:14px}
.sec{flex:1;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 6px;font-weight:600;font-size:14px}
.ghost{background:none;color:var(--mut);padding:6px 0}
.bar{height:6px;background:var(--line);border-radius:9px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fig{width:100%;height:210px;color:var(--fg);display:block}
.tag{display:inline-block;font-size:12px;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:1px 10px;margin-top:12px}
.name{font-size:26px;font-weight:800;margin:6px 0 2px}
.sub{font-size:20px;color:var(--acc);font-weight:700}
.tip{color:var(--mut);margin:6px 0 10px}
a.yt{display:block;text-align:center;border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--fg);text-decoration:none;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.row:last-child{border:0}.row span{color:var(--mut);text-align:right}
.row.cur b{color:var(--acc)}.row.ok{opacity:.45}
.ov{position:fixed;inset:0;background:var(--bg);display:none;overflow-y:auto;padding:16px;z-index:9}
#rest{flex-direction:column;align-items:center;justify-content:center;text-align:center}
#rest .n{font-size:110px;font-weight:800;color:var(--acc);line-height:1}
ul{padding-left:18px;color:var(--mut)}li{margin:5px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;text-align:center}
.cal small{font-size:11px;color:var(--mut)}
.cell{border-radius:10px;padding:10px 0;font-size:13px;font-weight:700;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.cell.t{color:var(--fg);border-color:var(--acc)}.cell.d{background:var(--acc);color:var(--on)}
</style></head><body>
<div id="app"></div>
<div id="rest" class="ov">
  <div style="color:var(--mut)">REST</div>
  <div class="n" id="rn">60</div>
  <p id="rnext" style="margin:10px 0 20px"></p>
  <button class="big" style="max-width:320px" onclick="endRest()">Skip rest</button>
</div>
<div id="pv" class="ov"><div style="max-width:520px;margin:0 auto" id="pvb"></div></div>
<script>
// pose = [headX,headY, shoulderX,Y, hipX,Y, elbowX,Y, handX,Y, kneeX,Y, footX,Y]
const S0=[50,14,50,26,50,54,52,40,52,55,50,72,51,90];
const CURL=[50,14,50,26,50,54,52,40,62,28,50,72,51,90];
const E={
walk:{n:'Easy walk / bike',m:'Warm-up',t:'Light cardio to warm up the whole body. Easy pace, you can still talk.',q:'gym warm up treadmill walk',eq:'n',a:[50,14,50,26,50,54,58,40,64,50,60,70,62,88],b:[50,14,50,26,50,54,42,40,36,50,42,70,36,88]},
circ:{n:'Arm circles',m:'Warm-up',t:'Big slow circles with straight arms. 10 forward, 10 backward.',q:'arm circles warm up shoulders',eq:'n',a:S0,b:[50,14,50,26,50,54,50,12,50,-2,50,72,51,90]},
bsq:{n:'Bodyweight squat',m:'Warm-up',t:'Sit back like sitting on a chair, chest up, then stand.',q:'bodyweight squat proper form',eq:'n',a:[50,14,50,26,50,54,54,40,58,32,50,72,51,90],b:[56,26,54,38,38,64,58,48,60,38,62,68,52,90]},
bench:{n:'Dumbbell Bench Press',m:'Chest',t:'Lie on the bench, dumbbells at chest level. Push straight up, lower slowly. Feet flat on the floor.',q:'dumbbell bench press proper form',x:'<rect x="6" y="76" width="62" height="5" rx="2" fill="var(--line)"/>',a:[16,68,28,72,56,72,36,80,32,62,74,62,72,88],b:[16,68,28,72,56,72,32,50,32,36,74,62,72,88]},
pushdown:{n:'Triceps Pushdown',m:'Triceps',t:'Stand at the cable machine. Elbows stuck to your sides. Push the handle down until your arms are straight.',q:'triceps pushdown cable proper form',an:[60,-8],a:[50,14,50,26,50,54,52,40,60,38,50,72,51,90],b:[50,14,50,26,50,54,52,40,53,56,50,72,51,90]},
ohe:{n:'Overhead Triceps Extension',m:'Triceps',t:'Hold one dumbbell with both hands behind your head. Push it straight up, elbows pointing forward.',q:'dumbbell overhead triceps extension form',a:[50,14,50,26,50,54,56,8,44,24,50,72,51,90],b:[50,14,50,26,50,54,56,8,56,-8,50,72,51,90]},
crunch:{n:'Crunch',m:'Abs',t:'Lie on your back, knees bent. Curl your shoulders up by squeezing your abs. Do not pull your neck.',q:'crunch proper form abs',eq:'n',a:[16,83,27,85,58,85,22,76,18,81,72,68,84,86],b:[30,66,38,72,58,85,32,60,28,66,72,68,84,86]},
plank:{n:'Plank',m:'Abs',t:'Elbows under shoulders, body in one straight line. Squeeze abs and glutes. Just hold and breathe.',q:'plank proper form',eq:'n',a:[14,60,24,64,54,72,24,84,38,86,72,80,90,88],b:[14,58,24,62,54,68,24,84,38,86,72,78,90,88]},
legraise:{n:'Lying Leg Raise',m:'Lower abs',t:'Lie on your back, hands under hips. Lift straight legs up, lower slowly without touching the floor.',q:'lying leg raise proper form',eq:'n',a:[10,83,20,85,46,85,30,85,40,85,66,85,86,85],b:[10,83,20,85,46,85,30,85,40,85,46,63,46,43]},
pulldown:{n:'Lat Pulldown',m:'Back',t:'Grab the bar wider than your shoulders. Pull it to your upper chest, elbows down. Do not lean back much.',q:'lat pulldown proper form',an:[58,-8],a:[50,32,50,44,50,70,56,28,58,10,68,68,68,90],b:[50,32,50,44,50,70,44,54,58,38,68,68,68,90]},
row:{n:'Seated Cable Row',m:'Back',t:'Sit tall. Pull the handle to your belly and squeeze your shoulder blades together. Return slowly.',q:'seated cable row proper form',an:[98,56],a:[46,30,48,42,40,70,62,54,78,56,66,64,72,88],b:[42,30,44,42,40,70,34,56,58,56,66,64,72,88]},
curl:{n:'Dumbbell Curl',m:'Biceps',t:'Elbows stay next to your body. Curl up, squeeze, lower slowly. No swinging.',q:'dumbbell bicep curl proper form',a:S0,b:CURL},
hammer:{n:'Hammer Curl',m:'Biceps + forearm',t:'Same as a curl but hold the dumbbells like hammers (palms facing each other).',q:'hammer curl proper form',a:S0,b:CURL},
squat:{n:'Goblet Squat',m:'Legs',t:'Hold one dumbbell at your chest. Sit down between your knees, chest up, then stand.',q:'goblet squat proper form',a:[50,14,50,26,50,54,54,40,58,32,50,72,51,90],b:[56,26,54,38,38,64,58,48,60,38,62,68,52,90]},
rdl:{n:'Romanian Deadlift',m:'Hamstrings + glutes',t:'Dumbbells in front of thighs. Push hips back, back straight, slide weights down your legs, then stand up.',q:'dumbbell romanian deadlift proper form',a:[50,14,50,26,50,54,52,40,54,56,50,72,51,90],b:[76,40,64,42,36,54,64,58,64,74,42,72,46,90]},
press:{n:'Dumbbell Shoulder Press',m:'Shoulders',t:'Dumbbells at shoulder height. Press straight up over your head, lower slowly.',q:'dumbbell shoulder press proper form',a:[50,14,50,26,50,54,60,36,57,22,50,72,51,90],b:[50,14,50,26,50,54,55,12,54,-4,50,72,51,90]},
lateral:{n:'Lateral Raise',m:'Shoulders',t:'Light dumbbells. Lift your arms out to the SIDES to shoulder height, then lower slowly. Do not swing.',q:'dumbbell lateral raise proper form',a:S0,b:[50,14,50,26,50,54,64,32,78,30,50,72,51,90]}
};
const W=[['walk',1,'5 min'],['circ',1,'10 each way'],['bsq',1,'10 reps']];
const DAYS=[
{n:'Day 1',t:'Chest · Triceps · Abs',ex:[['bench',4,'10 reps'],['pushdown',3,'12 reps'],['ohe',3,'12 reps'],['crunch',3,'15 reps'],['plank',3,'40 sec']]},
{n:'Day 2',t:'Back · Biceps · Abs',ex:[['pulldown',4,'10 reps'],['row',3,'10 reps'],['curl',3,'12 reps'],['hammer',3,'12 reps'],['legraise',3,'12 reps']]},
{n:'Day 3',t:'Legs · Abs',ex:[['squat',4,'12 reps'],['rdl',3,'10 reps'],['legraise',3,'12 reps'],['crunch',3,'15 reps'],['plank',3,'40 sec']]},
{n:'Day 4',t:'Shoulders · Arms · Abs',ex:[['press',4,'10 reps'],['lateral',3,'15 reps'],['curl',3,'12 reps'],['pushdown',3,'12 reps'],['crunch',3,'15 reps']]}
];
const WEEKS=[
'Learn the moves. Use LIGHT weights. Stop each set with 3 reps still left in you.',
'Add a little weight (2–2.5 kg) on each exercise if week 1 felt easy.',
'Keep the same weights. Try to hit the top reps on EVERY set.',
'Push week. Use the heaviest weight you can lift with good form. Then start Block 2.'];
const CAL=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'],MAP={0:0,1:1,3:2,4:3};
const $=id=>document.getElementById(id);
const LS={get(){try{return JSON.parse(localStorage.getItem('tp')||'{}')}catch(e){return{}}},set(o){try{localStorage.setItem('tp',JSON.stringify(o))}catch(e){}}};
let st=[],i=0,tm=0,after=null,dn='',wk=1,dk=0;const R={};

function fig(e,t,id){
  const p=e.a.map((v,k)=>v+(e.b[k]-v)*t),[hx,hy,sx,sy,px,py,ex,ey,wx,wy,kx,ky,fx,fy]=p;
  const L=(a,b,c,d,w,col)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  let s=L(4,90,96,90,1,'var(--line)')+(e.x||'');
  if(e.an)s+=L(e.an[0],e.an[1],wx,wy,1,'var(--mut)');
  s+=L(sx,sy,px,py,5,'var(--fg)')+L(px,py,kx,ky,5,'var(--fg)')+L(kx,ky,fx,fy,5,'var(--fg)')+L(fx,fy,fx+6,fy,3,'var(--fg)');
  s+=`<circle cx="${hx}" cy="${hy}" r="7" fill="var(--fg)"/>`+L(sx,sy,ex,ey,4,'var(--acc)')+L(ex,ey,wx,wy,4,'var(--acc)');
  if(e.eq!=='n')s+=L(wx-5,wy,wx+5,wy,5,'var(--acc)');
  return `<svg id="${id}" class="fig" viewBox="0 -10 100 105">${s}</svg>`;
}
function anim(e,id){
  cancelAnimationFrame(R[id]);const t0=performance.now();
  (function f(n){const t=(1-Math.cos((n-t0)/500))/2,el=$(id);if(el)el.outerHTML=fig(e,t,id);R[id]=requestAnimationFrame(f)})(t0);
}
function stopAnim(){Object.values(R).forEach(cancelAnimationFrame)}
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
const isDone=(w,d)=>!!LS.get()[w+'-'+d];
function curWeek(){for(let w=1;w<=4;w++)for(let d=0;d<4;d++)if(!isDone(w,d))return w;return 4}
function doneCount(){return Object.keys(LS.get()).length}

function home(){
  stopAnim();const w=curWeek();
  $('app').innerHTML=`<h1>Tony's Plan</h1><p class="tip">Bigger muscles, balanced body, strong abs + arms.</p>
  <div class="card day" onclick="plan()"><div><b>Month plan</b><small>${doneCount()} of 16 workouts done · Week ${w}</small></div><span class="pill">Open</span></div>
  <h2>Quick start · Week ${w}</h2>
  ${DAYS.map((d,k)=>`<div class="card day" onclick="start(${k},${w})"><div><b>${d.n} ${isDone(w,k)?'✓':''}</b><small>${d.t}</small></div><span class="pill">Start</span></div>`).join('')}
  <h2>Your body scan</h2><div class="card"><div class="grid">
  <div class="st"><b>75 kg</b><span>Weight</span></div><div class="st"><b>22.4%</b><span>Body fat</span></div><div class="st"><b>16.8 kg</b><span>Fat</span></div>
  <div class="st"><b>58.2 kg</b><span>Muscle + bones</span></div><div class="st"><b>42.6 kg</b><span>Water</span></div><div class="st"><b>26.3</b><span>BMI</span></div></div>
  <p class="tip" style="margin-top:12px">Healthy fat range for you: 14–20%. Abs show clearly around 14–16%, so we build muscle and slowly drop fat at the same time.</p></div>
  <h2>4 simple rules</h2><div class="card"><ul>
  <li>Protein every meal, about 135 g a day total.</li>
  <li>Choose a weight where the last 2 reps are hard.</li>
  <li>Sleep 7–8 hours. Muscles grow while you rest.</li>
  <li>Missed a day? Do it the next day. Never double up.</li></ul></div>`;
}

function plan(){
  stopAnim();
  $('app').innerHTML=`<button class="ghost" onclick="home()">← Back</button><h1>Month plan</h1>
  <p class="tip">Train 4 days a week. Tap a training day to start it. Done days turn green.</p>
  ${WEEKS.map((n,w)=>`<div class="card"><b style="font-size:18px">Week ${w+1}</b><p class="tip" style="margin:4px 0 0">${n}</p>
  <div class="cal">${CAL.map(c=>`<small>${c}</small>`).join('')}${CAL.map((c,j)=>{const d=MAP[j];return d===undefined?`<div class="cell">–</div>`:`<div class="cell t ${isDone(w+1,d)?'d':''}" onclick="start(${d},${w+1})">D${d+1}</div>`}).join('')}</div></div>`).join('')}
  <h2>How long? When to change?</h2>
  <div class="card"><ul>
  <li><b>Block 1 = weeks 1–4</b> (this month). Keep the same exercises so you can add weight each week.</li>
  <li><b>Block 2 = weeks 5–8.</b> Swap variations: Bench → Incline Dumbbell Press, Lat Pulldown → Pull-ups (or assisted), Goblet Squat → Leg Press, Shoulder Press → Arnold Press, Curl → Incline Curl, Pushdown → Rope Pushdown.</li>
  <li><b>Block 3 = weeks 9–12.</b> Go back to the Block 1 exercises, but heavier than before.</li>
  <li><b>Abs:</b> keep crunch, plank and leg raise all 12 weeks. Add 2 reps or 5 seconds every week.</li>
  <li><b>Weights rule:</b> if you hit the top reps on all sets in 2 workouts in a row, add weight next time.</li>
  <li><b>After 12 weeks:</b> do a new body scan and we build the next plan from it.</li></ul></div>`;
}

function start(k,w){
  dk=k;wk=w||curWeek();dn=DAYS[k].n+' · '+DAYS[k].t;
  st=[...W.map(x=>({k:x[0],n:x[1],r:x[2],c:0,w:1})),...DAYS[k].ex.map(x=>({k:x[0],n:x[1],r:x[2],c:0}))];
  i=0;show();
}
function show(){
  const x=st[i],e=E[x.k],tot=st.reduce((a,b)=>a+b.n,0),d2=st.reduce((a,b)=>a+b.c,0);
  $('app').innerHTML=`<button class="ghost" onclick="home()">← Exit</button><div style="font-size:13px;color:var(--mut)">Week ${wk} · ${dn}</div>
  <div class="bar"><i style="width:${d2/tot*100}%"></i></div>
  <div class="card">${fig(e,0,'fig')}</div>
  <span class="tag">${x.w?'WARM-UP':e.m}</span>
  <div class="name">${e.n}</div>
  <div class="sub">Set ${x.c+1} of ${x.n} · ${x.r}</div>
  <p class="tip">${e.t}</p>
  <a class="yt" href="${yt(e.q)}" target="_blank" rel="noopener">▶ Watch technique on YouTube</a>
  <button class="big" onclick="done()">${x.c+1<x.n?'Set done ✓':(i<st.length-1?'Done ✓ Next exercise':'Finish workout ✓')}</button>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="sec" onclick="back()">◀ Back</button><button class="sec" onclick="skipSet()">Skip set</button><button class="sec" onclick="nextEx()">Next exercise ▶</button></div>
  <h2>Left today · tap to preview</h2><div class="card">${st.map((y,j)=>`<div class="row ${j==i?'cur':''} ${y.c>=y.n?'ok':''}" onclick="pv(${j})"><b>${E[y.k].n}</b><span>${y.c>=y.n?'✓ done':(y.n-y.c)+(y.n-y.c>1?' sets':' set')+' left · '+y.r}</span></div>`).join('')}</div>`;
  anim(e,'fig');window.scrollTo(0,0);
}
function done(){
  const x=st[i];x.c++;
  if(x.c<x.n){rest(x.w?0:60,'Next: Set '+(x.c+1)+' of '+x.n+' · '+E[x.k].n,show)}
  else if(i<st.length-1){i++;rest(x.w?0:60,'Next: '+E[st[i].k].n,show)}
  else fin();
}
function skipSet(){
  const x=st[i];x.c++;
  if(x.c>=x.n){if(i<st.length-1)i++;else{fin();return}}
  show();
}
function back(){
  const x=st[i];
  if(x.c>0)x.c--;
  else if(i>0){i--;const y=st[i];if(y.c>=y.n)y.c=y.n-1}
  show();
}
function nextEx(){if(i<st.length-1){i++;show()}}
function pv(j){
  const y=st[j],e=E[y.k];
  $('pvb').innerHTML=`<div class="card">${fig(e,0,'fig2')}</div>
  <span class="tag">${y.w?'WARM-UP':e.m}</span><div class="name">${e.n}</div>
  <div class="sub">${y.n} ${y.n>1?'sets':'set'} · ${y.r}</div><p class="tip">${e.t}</p>
  <a class="yt" href="${yt(e.q)}" target="_blank" rel="noopener">▶ Watch technique on YouTube</a>
  <button class="big" onclick="goTo(${j})">Go to this exercise</button>
  <button class="big" style="background:var(--card);color:var(--fg);border:1px solid var(--line);margin-top:10px" onclick="closePv()">Close</button>`;
  $('pv').style.display='block';anim(e,'fig2');
}
function closePv(){cancelAnimationFrame(R.fig2);$('pv').style.display='none'}
function goTo(j){closePv();i=j;show()}
function rest(sec,msg,cb){
  if(!sec){cb();return}
  cancelAnimationFrame(R.fig);after=cb;let n=sec;
  $('rn').textContent=n;$('rnext').textContent=msg;$('rest').style.display='flex';
  clearInterval(tm);tm=setInterval(()=>{n--;$('rn').textContent=n;if(n<=0)endRest()},1000);
}
function endRest(){
  clearInterval(tm);$('rest').style.display='none';
  if(after){const f=after;after=null;f()}
}
function fin(){
  stopAnim();const o=LS.get();o[wk+'-'+dk]=1;LS.set(o);
  $('app').innerHTML=`<div style="text-align:center;padding:80px 0"><div style="font-size:64px">💪</div><h1 style="margin:10px 0">Workout done!</h1><p class="tip">Week ${wk} · ${dn}<br>${doneCount()} of 16 workouts done. Eat protein and sleep well.</p><button class="big" onclick="home()">Back to home</button></div>`;
}
home();
</script></body></html>
